# ~/.config/tmux/tmux.conf — managed by dotfiles
# Reload: prefix + r      Plugins: prefix + I (install) / U (update)

# ---------------------------------------------------------------- prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ------------------------------------------------------------ key binds ---
# splits: q = side by side, w = stacked (open in the current directory)
bind q split-window -h -c "#{pane_current_path}"
bind w split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# new window: n
bind n new-window -c "#{pane_current_path}"
unbind c
# move between panes with Alt+arrows (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# resize with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# window/session pickers (q and w were taken by the splits)
bind s choose-tree -Zs
bind W choose-tree -Zw
# reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --------------------------------------------------------------- general ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0          # no delay after Esc (vim)
set -g focus-events on
set -g display-time 2000
set -g set-clipboard on

# true color + extended keys (Shift+Enter etc. reach apps like Claude Code)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,alacritty*:RGB,xterm-kitty:RGB"
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys,alacritty*:extkeys,xterm-kitty:extkeys"

# vi copy mode: v to select, y to copy (tmux-yank sends it to the clipboard)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# quiet: no bells or activity alerts
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ---------------------------------------------------------------- design ---
# ANSI color names only, so tmux follows the terminal's theme.
setw -g clock-mode-colour yellow
setw -g mode-style 'fg=black bg=red bold'
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=yellow'
set -g message-style 'fg=yellow bg=black bold'

set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red bg=default'
# session name; turns green while the prefix is pressed
# small dot: blue, turns green while the prefix is pressed
set -g status-left '#{?client_prefix,#[fg=green],#[fg=blue]} ● #[default]'
set -g status-left-length 30

setw -g window-status-current-style 'fg=black bg=blue bold'
setw -g window-status-current-format '#[fg=blue,bg=default]#[fg=black,bg=blue]#I #W#{?window_zoomed_flag, 󰊓,}#[fg=blue,bg=default]'
setw -g window-status-style 'fg=red'
setw -g window-status-format ' #I #[fg=white]#W#{?window_zoomed_flag, 󰊓,} '
setw -g window-status-separator ''
setw -g window-status-bell-style 'fg=yellow bg=red bold'

# right side of the status bar: chosen by the installer (minimal | stats)
source-file -q ~/.config/tmux/status.conf

# --------------------------------------------------------------- plugins ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix C-s save, C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min
set -g @plugin 'tmux-plugins/tmux-yank'        # copy to system clipboard
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @continuum-restore 'off'                # set 'on' to restore on tmux start

# generated by the installer (optional extras) and your own untracked overrides
source-file -q ~/.config/tmux/extras.conf
source-file -q ~/.config/tmux/local.conf

if-shell "test -x ~/.local/share/tmux/plugins/tpm/tpm" "run-shell -b '~/.local/share/tmux/plugins/tpm/tpm'"
