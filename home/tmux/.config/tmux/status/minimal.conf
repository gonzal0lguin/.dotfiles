# Status bar: minimal (host + time; date only when there is room)
set -g status-interval 30
set -g status-right-length 50
set -g status-right "#{?#{e|>=:#{client_width},90},#[fg=brightblack]#H ,}#[fg=yellow,bg=default]#[fg=black,bg=yellow]#{?#{e|>=:#{client_width},120},%m/%d ,}%H:%M#[fg=yellow,bg=default]"
