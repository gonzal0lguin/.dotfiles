# Status bar: system stats as colored blocks side by side (IP, CPU, RAM, GPU, date).
# Blocks drop out on narrow terminals so it still fits with big fonts:
#   < 100 cols: no IP    < 90: no GPU    < 80: no date (time only)    < 60: time only
set -g status-interval 5
set -g status-right-length 100
set -g status-right "#[fg=#{?#{e|>=:#{client_width},100},cyan,#{?#{e|>=:#{client_width},60},magenta,yellow}},bg=default]"
set -ga status-right "#{?#{e|>=:#{client_width},100},#[fg=black#,bg=cyan] 󰩟 #(~/.config/tmux/scripts/stats.sh ip) ,}"
set -ga status-right "#{?#{e|>=:#{client_width},60},#[fg=black#,bg=magenta]  #(~/.config/tmux/scripts/stats.sh cpu) #[bg=green] 󰍛 #(~/.config/tmux/scripts/stats.sh ram) ,}"
set -ga status-right "#{?#{e|>=:#{client_width},90},#(~/.config/tmux/scripts/stats.sh gpu),}"
set -ga status-right "#[fg=black,bg=yellow] 󰃰 #{?#{e|>=:#{client_width},80},%m/%d ,}%H:%M #[fg=yellow,bg=default]"
