# Minimal config for the dedicated tmux server that wraps `claude`
# (see ~/.config/zsh/claude.zsh). Needed by the auto-compact plugin.
set -g prefix C-a
unbind C-b
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g status off
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,alacritty*:RGB,xterm-kitty:RGB"
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys,alacritty*:extkeys,xterm-kitty:extkeys"
