# Status bar: system stats (CPU, RAM, GPU when nvidia-smi exists, IP, date)
set -g status-interval 5
set -g status-right-length 140
set -g status-right "#[fg=cyan,bg=default]#[fg=black,bg=cyan] 󰩟 #(~/.config/tmux/scripts/stats.sh ip) #[fg=cyan,bg=default] "
set -ga status-right "#[fg=magenta,bg=default]#[fg=black,bg=magenta]  #(~/.config/tmux/scripts/stats.sh cpu) #[fg=magenta,bg=default] "
set -ga status-right "#[fg=green,bg=default]#[fg=black,bg=green]  #(~/.config/tmux/scripts/stats.sh ram) #[fg=green,bg=default] "
set -ga status-right "#(~/.config/tmux/scripts/stats.sh gpu)"
set -ga status-right "#[fg=yellow,bg=default]#[fg=black,bg=yellow] 󰃰 %m/%d %H:%M #[fg=yellow,bg=default] "
