# kitty — managed by dotfiles.  Reload: ctrl+shift+F5
#   theme      -> ~/.config/dotfiles/current/kitty.conf  (dot theme <name>)
#   autostart  -> autostart.conf (generated by install.sh)
#   your edits -> local.conf (untracked; loaded last)
include ~/.config/dotfiles/current/kitty.conf

font_family      0xProto Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

window_padding_width 5 10
remember_window_size no
initial_window_width  100c
initial_window_height 30c

# tmux does the tabs/splits
tab_bar_style hidden
enable_audio_bell no
confirm_os_window_close 0
scrollback_lines 10000
copy_on_select clipboard
url_style curly
shell_integration enabled

# Shift+Enter works out of the box in kitty (kitty keyboard protocol).
map ctrl+shift+n new_os_window

globinclude autostart.conf
globinclude local.conf
