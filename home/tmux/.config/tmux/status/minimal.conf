# Status bar: minimal (host + date; host and date drop out on narrow terminals)
set -g status-interval 30
set -g status-right-length 50
set -g status-right "#{?#{e|>=:#{client_width},80},#[fg=brightblack]#H ,}#[fg=yellow,bg=default]#[fg=black,bg=yellow] 󰃰 #{?#{e|>=:#{client_width},80},%m/%d ,}%H:%M #[fg=yellow,bg=default]"
