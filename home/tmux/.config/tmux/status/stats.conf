# Status bar: system stats in one compact strip (IP, CPU, RAM, GPU, time).
# Items drop out as the terminal gets narrower, so it fits big fonts too:
#   < 150 cols: no IP     < 120 cols: no GPU, time without date     < 90 cols: only time
set -g status-interval 5
set -g status-right-length 100
set -g status-right "#[fg=brightblack,bg=default]#[fg=white,bg=brightblack]"
set -ga status-right "#{?#{e|>=:#{client_width},150},#[fg=cyan]󰩟 #[fg=white]#(~/.config/tmux/scripts/stats.sh ip) ,}"
set -ga status-right "#{?#{e|>=:#{client_width},90},#[fg=magenta] #[fg=white]#(~/.config/tmux/scripts/stats.sh cpu) #[fg=green] #[fg=white]#(~/.config/tmux/scripts/stats.sh ram) ,}"
set -ga status-right "#{?#{e|>=:#{client_width},120},#(~/.config/tmux/scripts/stats.sh gpu),}"
set -ga status-right "#[fg=yellow,bg=brightblack]#[fg=black,bg=yellow]#{?#{e|>=:#{client_width},120},%m/%d ,}%H:%M#[fg=yellow,bg=default]"
