# Alacritty — managed by dotfiles.
# Written for 0.13 (Ubuntu apt); newer versions accept it with deprecation notes.
#   theme      -> ~/.config/dotfiles/current/alacritty.toml   (dot theme <name>)
#   autostart  -> ~/.config/alacritty/autostart.toml          (generated by install.sh)
#   your edits -> ~/.config/alacritty/local.toml              (untracked; loaded last)
import = [
  "~/.config/dotfiles/current/alacritty.toml",
  "~/.config/alacritty/autostart.toml",
  "~/.config/alacritty/local.toml",
]
live_config_reload = true

[window]
title = "Gonz's terminal"
dimensions = { columns = 100, lines = 30 }
padding = { x = 10, y = 5 }
dynamic_padding = true

[font]
size = 12.0
normal = { family = "0xProto Nerd Font", style = "Regular" }
bold = { family = "0xProto Nerd Font", style = "Bold" }
italic = { family = "0xProto Nerd Font", style = "Italic" }
bold_italic = { family = "0xProto Nerd Font", style = "Bold Italic" }

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[[keyboard.bindings]]   # Shift+Enter -> newline in Claude Code
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"
